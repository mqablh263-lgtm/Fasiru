<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مشروع فسيحوا القرآني</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        :root {
            --bg-color: #112c1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #a3b1ab;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Tajawal', sans-serif; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--gold); margin-bottom: 30px; }
        .student-card { background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .student-name { font-size: 1.2rem; font-weight: 700; flex: 1; min-width: 150px; }
        input { background: #0a1b12; border: 1px solid rgba(212, 175, 55, 0.5); color: #fff; padding: 8px 12px; border-radius: 8px; width: 80px; text-align: center; font-family: 'Tajawal', sans-serif; }
        button { background: #2e7d32; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 700; transition: 0.2s; }
        button:hover { background: #388e3c; }
        .login-box { max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center; border: 1px solid var(--gold); }
        .login-box input { width: 80%; margin-bottom: 15px; padding: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-box">
        <h2>تسجيل دخول لوحة التحكم</h2>
        <p style="color: var(--text-muted); margin-bottom: 15px;">أدخل كلمة المرور (123)</p>
        <input type="password" id="passInput" placeholder="كلمة المرور">
        <br>
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="adminPanel" class="container" style="display: none;">
        <h1>لوحة تحكم رصد الإنجازات</h1>
        <div id="studentsList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3RW60RPjgVAZoh2jaw2Nwp5br5-2lE",
            authDomain: "fasiru-5f537.firebaseapp.com",
            projectId: "fasiru-5f537",
            storageBucket: "fasiru-5f537.firebasestorage.app",
            messagingSenderId: "717351224516",
            appId: "1:717351224516:web:73b1712f0c4c902bcb591"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultStudents = [
            { id: 1, name: "احمد عبدالله ربابعه", parts: 0, pages: 0 },
            { id: 2, name: "هشام موسى دهون", parts: 0, pages: 0 },
            { id: 3, name: "أسامة احمد بشارات", parts: 0, pages: 0 },
            { id: 4, name: "مقداد شاكر مقدادي", parts: 0, pages: 0 }
        ];

        window.checkPass = function() {
            if(document.getElementById('passInput').value === '123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadStudents();
            } else {
                alert('كلمة المرور خطأ (الباسورد: 123)');
            }
        }

        function loadStudents() {
            const studentsRef = ref(db, 'students');
            onValue(studentsRef, (snapshot) => {
                const data = snapshot.val() || defaultStudents;
                renderList(data);
            });
        }

        function renderList(students) {
            const container = document.getElementById('studentsList');
            container.innerHTML = '';
            students.forEach((student, index) => {
                container.innerHTML += `
                    <div class="student-card">
                        <div class="student-name">${student.name}</div>
                        <div>المجموع الحالي: ${student.parts} جزء و ${student.pages} صفحة</div>
                        <div>
                            <input type="number" id="parts_${index}" placeholder="أجزاء" value="0">
                            <input type="number" id="pages_${index}" placeholder="صفحات" value="0">
                            <button onclick="updateStudent(${index})">تأكيد الرصد</button>
                        </div>
                    </div>
                `;
            });
        }

        window.updateStudent = function(index) {
            const pInput = parseInt(document.getElementById(`parts_${index}`).value) || 0;
            const pgInput = parseInt(document.getElementById(`pages_${index}`).value) || 0;

            const studentsRef = ref(db, 'students');
            onValue(studentsRef, (snapshot) => {
                let students = snapshot.val() || defaultStudents;
                students[index].parts += pInput;
                students[index].pages += pgInput;

                // تحويل الصفحات الزائدة لأجزاء (كل 20 صفحة = جزء مثلاً أو حسب نظامكم)
                if(students[index].pages >= 20) {
                    students[index].parts += Math.floor(students[index].pages / 20);
                    students[index].pages = students[index].pages % 20;
                }

                set(studentsRef, students).then(() => {
                    alert('تم رصد الإنجاز بنجاح وترحيله سحابياً!');
                });
            }, { onlyOnce: true });
        }
    </script>
</body>
</html>
