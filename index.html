<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة العرض - مشروع فسيحوا القرآني</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        :root {
            --bg-color: #112c1e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #a3b1ab;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Tajawal', sans-serif; padding: 30px; direction: rtl; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: var(--gold); font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 10px rgba(212,175,55,0.4); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 2px solid var(--gold); border-radius: 16px; padding: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .name { font-size: 1.8rem; font-weight: 900; }
        .score { font-size: 1.4rem; color: #a5d6a7; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 12px; border: 1px solid #2e7d32; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مشروع فسيحوا القرآني - لوحة الشرف الحية</h1>
        <div id="displayList" class="grid">
            <p style="text-align: center; grid-column: 1/-1; font-size: 1.5rem; color: var(--text-muted);">جاري تحميل لوحة الشرف المباشرة...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3RW60RPjgVAZoh2jaw2Nwp5br5-2lE",
            authDomain: "fasiru-5f537.firebaseapp.com",
            projectId: "fasiru-5f537",
            storageBucket: "fasiru-5f537.firebasestorage.app",
            messagingSenderId: "717351224516",
            appId: "1:717351224516:web:73b1712f0c4c902bcb591"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const studentsRef = ref(db, 'students');
        onValue(studentsRef, (snapshot) => {
            const students = snapshot.val();
            const container = document.getElementById('displayList');
            container.innerHTML = '';
            
            if(students) {
                students.forEach(student => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="name">${student.name}</div>
                            <div class="score">${student.parts} جزء و ${student.pages} صفحة</div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
